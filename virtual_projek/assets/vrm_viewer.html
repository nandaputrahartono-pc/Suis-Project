<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VRM Avatar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { 
      width: 100%; height: 100%; 
      overflow: hidden; 
      background: transparent; 
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #loading {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #c8ff00; font-family: monospace; font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="loading">Loading 3D Model...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
      "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3/lib/three-vrm.module.min.js",
      "@pixiv/three-vrm-animation": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm-animation@3/lib/three-vrm-animation.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
    import { VRMAnimationLoaderPlugin, createVRMAnimationClip } from '@pixiv/three-vrm-animation';

    // ============ GLOBALS ============
    let vrm = null;
    let clock = new THREE.Clock();
    let isSpeaking = false;          // For lip sync (word level)
    let isSpeakingSentence = false;  // For body animation (sentence level)
    let isListening = false;
    let isProcessing = false;
    let isWaving = false;
    let lipSyncPhase = 0;

    let currentMixer = null;
    let currentAction = null;

    // Blink
    let blinkTimer = 0;
    let nextBlinkTime = 3 + Math.random() * 4;
    let isBlinking = false;
    let blinkProgress = 0;

    // Idle sway
    let idleTime = 0;

    let backendUrl = '';

    // ============ SCENE ============
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera — adjusted for portrait phone screen (bust-up shot)
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    // Posisi kamera di depan dada atas, jarak sedikit lebih dekat (1.9) agar sedikit lebih besar
    camera.position.set(0, 1.3, 1.9);
    // Lihat ke arah perut/dada bawah (0.95) supaya kepala sedikit ke atas layar
    camera.lookAt(0, 0.95, 0);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
    mainLight.position.set(1, 2, 3);
    scene.add(mainLight);

    const fillLight = new THREE.DirectionalLight(0xc8ff00, 0.2);
    fillLight.position.set(-2, 1, -1);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0x8844ff, 0.3);
    rimLight.position.set(0, 1, -3);
    scene.add(rimLight);

    // ============ LOAD VRM ============
    function loadModel(url) {
      const loadingEl = document.getElementById('loading');
      
      const loader = new GLTFLoader();
      loader.crossOrigin = 'anonymous';
      
      // Register VRM plugin
      loader.register((parser) => {
        return new VRMLoaderPlugin(parser);
      });
      
      // Register VRM Animation plugin
      loader.register((parser) => {
        return new VRMAnimationLoaderPlugin(parser);
      }); 
      
      loader.load(
        url,
        (gltf) => {
          vrm = gltf.userData.vrm;
          VRMUtils.removeUnnecessaryJoints(vrm.scene);
          VRMUtils.removeUnnecessaryVertices(vrm.scene);

          // Rotate to face camera
          vrm.scene.rotation.y = Math.PI;

          // Reset posisi Y model ke 0 (sudah diatur oleh kamera)
          vrm.scene.position.y = 0;

          // === FIX T-POSE → Natural rest pose ===
          applyRestPose(vrm);

          scene.add(vrm.scene);
          
          if (loadingEl) loadingEl.style.display = 'none';
          console.log('VRM loaded successfully');

          // Trigger Waving saat pertama kali load secara prosedural
          isWaving = true;
          setTimeout(() => { isWaving = false; }, 4000);
          
          // Inisiasi timer idle
          lastAnimTime = clock.elapsedTime;
        },
        (progress) => {
          if (progress.total > 0) {
            const pct = Math.round((progress.loaded / progress.total) * 100);
            if (loadingEl) loadingEl.textContent = `Loading... ${pct}%`;
          }
        },
        (error) => {
          console.error('VRM load error:', error);
          if (loadingEl) loadingEl.textContent = 'Failed to load model';
        }
      );
    }

    // ============ REST POSE (fix T-pose) ============
    function applyRestPose(vrm) {
      const humanoid = vrm.humanoid;
      if (!humanoid) return;

      // Tangan turun ke samping badan (bukan T-pose)
      const leftUpperArm = humanoid.getNormalizedBoneNode('leftUpperArm');
      const rightUpperArm = humanoid.getNormalizedBoneNode('rightUpperArm');
      const leftLowerArm = humanoid.getNormalizedBoneNode('leftLowerArm');
      const rightLowerArm = humanoid.getNormalizedBoneNode('rightLowerArm');

      if (leftUpperArm) {
        leftUpperArm.rotation.z = 1.1; // ~63 derajat turun
      }
      if (rightUpperArm) {
        rightUpperArm.rotation.z = -1.1;
      }
      // Siku sedikit ditekuk agar natural
      if (leftLowerArm) {
        leftLowerArm.rotation.z = 0.15;
      }
      if (rightLowerArm) {
        rightLowerArm.rotation.z = -0.15;
      }

      // Kepala sedikit miring (cute)
      const head = humanoid.getNormalizedBoneNode('head');
      if (head) {
        head.rotation.z = 0.03;
      }

      // Update skeleton
      vrm.scene.updateMatrixWorld(true);
    }

    // ============ LIP SYNC ============
    const vowels = ['aa', 'ih', 'ou', 'ee', 'oh'];

    function updateLipSync(delta) {
      if (!vrm || !vrm.expressionManager) return;

      if (isSpeaking) {
        lipSyncPhase += delta * 7;
        
        const openAmount = Math.max(0, Math.sin(lipSyncPhase) * 0.6 + 0.15);
        const vowelIndex = Math.floor(lipSyncPhase * 0.6) % vowels.length;
        
        for (const v of vowels) {
          vrm.expressionManager.setValue(v, 0);
        }
        vrm.expressionManager.setValue(vowels[vowelIndex], openAmount);
        
      } else {
        for (const v of vowels) {
          const current = vrm.expressionManager.getValue(v) || 0;
          if (current > 0.01) {
            vrm.expressionManager.setValue(v, current * 0.85);
          } else {
            vrm.expressionManager.setValue(v, 0);
          }
        }
      }
    }

    // ============ BLINK ============
    function updateBlink(delta) {
      if (!vrm || !vrm.expressionManager) return;

      blinkTimer += delta;

      if (!isBlinking && blinkTimer >= nextBlinkTime) {
        isBlinking = true;
        blinkProgress = 0;
      }

      if (isBlinking) {
        blinkProgress += delta * 10;
        
        if (blinkProgress < 1) {
          vrm.expressionManager.setValue('blink', blinkProgress);
        } else if (blinkProgress < 2) {
          vrm.expressionManager.setValue('blink', 2 - blinkProgress);
        } else {
          vrm.expressionManager.setValue('blink', 0);
          isBlinking = false;
          blinkTimer = 0;
          nextBlinkTime = 2 + Math.random() * 5;
        }
      }
    }

    // ============ LOAD VRMA ============
    let lastAnimTime = 0;

    window.playVrmaContext = function(type) {
      let vrmaToPlay = '';
      if (type === 'greeting') {
        const choices = ['VRMA_03.vrma', 'VRMA_04.vrma'];
        vrmaToPlay = choices[Math.floor(Math.random() * choices.length)];
      } else if (type === 'normal') {
        const choices = ['VRMA_04.vrma', 'VRMA_05.vrma', 'VRMA_06.vrma', 'VRMA_07.vrma'];
        vrmaToPlay = choices[Math.floor(Math.random() * choices.length)];
      } else if (type === 'idle') {
        const choices = ['VRMA_01.vrma', 'VRMA_05.vrma'];
        vrmaToPlay = choices[Math.floor(Math.random() * choices.length)];
      }
      
      if (vrmaToPlay !== '') {
        console.log("Memainkan context " + type + " dengan " + vrmaToPlay);
        loadVRMA(backendUrl + '/models/' + vrmaToPlay);
      }
    };

    function loadVRMA(url) {
      if (!vrm) return;
      
      // Stop current animation if any
      if (currentAction) {
        currentAction.stop();
        currentAction = null;
      }
      
      const loader = new GLTFLoader();
      loader.register((parser) => new VRMAnimationLoaderPlugin(parser));
      
      loader.load(url, (gltf) => {
        const vrmAnimation = gltf.userData.vrmAnimations ? gltf.userData.vrmAnimations[0] : gltf.userData.vrmAnimation;
        if (vrmAnimation) {
          if (!currentMixer) {
            currentMixer = new THREE.AnimationMixer(vrm.scene);
            currentMixer.addEventListener('finished', (e) => {
               console.log("Animasi selesai");
               if (currentAction) {
                 currentAction.stop();
                 currentAction = null;
               }
               lastAnimTime = clock.elapsedTime;
            });
          }
          
          const clip = createVRMAnimationClip(vrmAnimation, vrm);
          currentAction = currentMixer.clipAction(clip);
          
          currentAction.setLoop(THREE.LoopOnce);
          currentAction.clampWhenFinished = true;
          currentAction.play();
          
          isWaving = false;
        }
      }, undefined, (err) => console.error(err));
    }

    // ============ BODY & HEAD ANIMATION ============
    function updateBodyAnimation(delta) {
      if (!vrm || !vrm.humanoid) return;
      idleTime += delta;

      const head = vrm.humanoid.getNormalizedBoneNode('head');
      const spine = vrm.humanoid.getNormalizedBoneNode('spine');
      const upperChest = vrm.humanoid.getNormalizedBoneNode('upperChest');

      // Base breathing (selalu ada)
      const breathY = Math.sin(idleTime * 1.5) * 0.002;
      vrm.scene.position.y = breathY;

      // ======================== TULANG KEPALA & BADAN ========================

      if (isWaving) {
        // Hanya sedikit mengangguk saat awal
        if (head) head.rotation.z += (0.05 - head.rotation.z) * 0.1;
      } else if (isProcessing) {
        // Berpikir (Kepala miring dikit)
        if (head) {
          head.rotation.z += (0.05 - head.rotation.z) * 0.05;
          head.rotation.x += (0.02 - head.rotation.x) * 0.05;
        }
      } else if (isSpeakingSentence) {
        // Menjelaskan 
        // Badan sedikit bergerak perlahan
        if (spine) spine.rotation.z = Math.sin(idleTime * 1.5) * 0.01;
        if (head) {
          head.rotation.x = 0.02 + Math.sin(idleTime * 1.2) * 0.02;
          head.rotation.z = Math.sin(idleTime * 1.0) * 0.015;
          head.rotation.y = Math.sin(idleTime * 0.8) * 0.02; 
        }
      } else if (isListening) {
        // Mendengarkan 
        if (head) {
          const targetTilt = Math.sin(idleTime * 0.2) > 0 ? 0.03 : -0.03; 
          head.rotation.z += (targetTilt - head.rotation.z) * 0.05;
          head.rotation.x = Math.sin(idleTime * 0.5) * 0.02;
          head.rotation.y = Math.sin(idleTime * 0.4) * 0.015;
        }
        if (spine) spine.rotation.z = Math.sin(idleTime * 0.5) * 0.01;
      } else {
        // Idle
        if (head) {
          head.rotation.z += (0 - head.rotation.z) * 0.1;
          head.rotation.x = Math.sin(idleTime * 0.8) * 0.01;
          head.rotation.y = Math.sin(idleTime * 0.4) * 0.01;
        }
        if (spine) spine.rotation.z = Math.sin(idleTime * 0.3) * 0.005;
      }
    }

    // ============ RENDER LOOP ============
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();

      if (currentMixer) {
        currentMixer.update(delta);
      }
      
      // Auto-trigger idle animation
      if (!currentAction && !isSpeakingSentence && vrm) {
        if (clock.elapsedTime - lastAnimTime > 10) {
           lastAnimTime = clock.elapsedTime;
           window.playVrmaContext('idle');
        }
      }

      updateLipSync(delta);
      updateBlink(delta);
      updateBodyAnimation(delta);

      if (vrm) {
        vrm.update(delta);
      }

      renderer.render(scene, camera);
    }
    animate();

    // ============ RESIZE ============
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ============ API dari Flutter ============
    window.initAvatar = function(url) {
      backendUrl = url;
      loadModel(url + '/models/CamomeCamome.vrm');
    };

    window.startSpeaking = function() {
      isSpeaking = true;
      lipSyncPhase = 0;
    };

    window.stopSpeaking = function() {
      isSpeaking = false;
    };

    window.setSpeakingSentence = function(state) {
      isSpeakingSentence = state;
    };

    window.setListening = function(state) {
      isListening = state;
    };

    window.setProcessing = function(state) {
      isProcessing = state;
    };

    window.setExpression = function(name) {
      if (!vrm || !vrm.expressionManager) return;
      const emotions = ['happy', 'sad', 'angry', 'relaxed', 'surprised'];
      for (const e of emotions) {
        vrm.expressionManager.setValue(e, 0);
      }
      if (name !== 'neutral' && emotions.includes(name)) {
        vrm.expressionManager.setValue(name, 0.7);
      }
    };
  </script>
</body>
</html>
